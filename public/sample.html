<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express Static File Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        line-height: 1.6;
        background: #f5f5f5;
      }
      h1 {
        color: #333;
      }
      .box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Hello from Express Static!</h1>
      <p>
        If you can see this page, Express is successfully serving static files.
      </p>
      <p>This file is being served from the <code>public</code> folder.</p>
    </div>
  </body>
</html>
